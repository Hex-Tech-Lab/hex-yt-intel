name = "youtube-intelligence"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
routes = [
  { pattern = "youtube-intelligence.workers.dev/*", zone_name = "workers.dev" }
]

[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.ts"]

[[build.upload]]
format = "service-worker"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.vars]]
name = "YOUTUBE_API_KEY"
text = ""

[env.staging]
routes = [
  { pattern = "youtube-intel-staging.workers.dev/*", zone_name = "workers.dev" }
]

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.vars]]
name = "YOUTUBE_API_KEY"
text = ""

# Local development
[env.development]
vars = { ENVIRONMENT = "development" }
