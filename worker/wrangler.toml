name = "yt-intel"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm run build"
cwd = "./"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1.0
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1.0

[env.production]
name = "yt-intel-prod"
routes = [
  { pattern = "yt-intel.kellybakri.workers.dev/*" }
]
placement = { mode = "smart" }
vars = { ENVIRONMENT = "production", REGION = "eu-west-1" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.development]
vars = { ENVIRONMENT = "development" }
