name = "yt-intel"
main = "dist/worker.js"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]
vars = { REGION = "eu-west-3", WORKER_NAME = "yt-intel", ENVIRONMENT = "production" }

# KV namespace bindings for LLM analysis caching (7-day TTL)
[[kv_namespaces]]
binding = "KV"
id = "yt-intel-kv-cache"
preview_id = "yt-intel-kv-cache-preview"

[env.production]
name = "yt-intel"
vars = { REGION = "eu-west-3", WORKER_NAME = "yt-intel", ENVIRONMENT = "production" }
# Production secrets (deploy via wrangler secret put):
# YOUTUBE_API_KEY - YouTube Data API key for transcript extraction
# CLOUDFLARE_SECRET_TOKEN - Internal auth token for worker endpoints
# RESIDENTIAL_PROXY_URL - Bright Data proxy URL (format: user:pass@host:port)
# OPENROUTER_API_KEY - OpenRouter API key for LLM analysis (format: sk-or-v1-...)

[build]
command = "pnpm run build"

# Secrets Deployment Instructions:
# ================================
# Deploy worker secrets to production with:
#   wrangler secret put YOUTUBE_API_KEY --env production
#   wrangler secret put CLOUDFLARE_SECRET_TOKEN --env production
#   wrangler secret put RESIDENTIAL_PROXY_URL --env production
#   wrangler secret put OPENROUTER_API_KEY --env production
#
# Current RESIDENTIAL_PROXY_URL value (Bright Data - with authentication):
#   brd-customer-hl_da92bd7c-zone-yt_intel_prx1:qa0ffc1kewsa@brd.superproxy.io:33335
#
# This enables:
# - YouTube metadata extraction with geo-distributed proxy routing
# - YouTube transcript extraction with IP block bypass
# - LLM analysis with 3-model cascade (Nemotron → Laguna → GLM) via OpenRouter
# - 7-day KV caching for deterministic analysis results
# - Resilient content retrieval for full analysis pipeline
