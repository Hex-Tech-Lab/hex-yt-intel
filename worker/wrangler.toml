name = "youtube-intelligence"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm run build"
cwd = "./"
watch_paths = ["src/**/*.ts"]

[[build.upload]]
format = "service-worker"

[env.production.vars]
ENVIRONMENT = "production"
YOUTUBE_API_KEY = "AIzaSyChEE4iNoH4Ei4SO8s5dt-VwnBjC3q-7qw"

[env.staging.vars]
ENVIRONMENT = "staging"
YOUTUBE_API_KEY = "AIzaSyChEE4iNoH4Ei4SO8s5dt-VwnBjC3q-7qw"

# Local development
[env.development]
vars = { ENVIRONMENT = "development" }
