name = "yt-intel"
main = "dist/worker.js"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]
vars = { REGION = "eu-west-3", WORKER_NAME = "yt-intel", ENVIRONMENT = "production" }

[env.production]
name = "yt-intel"
vars = { REGION = "eu-west-3", WORKER_NAME = "yt-intel", ENVIRONMENT = "production", APP_URL = "https://yt-intel.getmytestdrive.com" }
# Production secrets (deploy via wrangler secret put):
#   wrangler secret put RESIDENTIAL_PROXY_URL --env production
#   wrangler secret put STREAM_HMAC_SECRET --env production
#   wrangler secret put YOUTUBE_API_KEY --env production
#   wrangler secret put CLOUDFLARE_SECRET_TOKEN --env production
#   wrangler secret put OPENROUTER_API_KEY --env production
#
# RESIDENTIAL_PROXY_URL set via `wrangler secret put RESIDENTIAL_PROXY_URL --env production`
# Format: brd-customer-<CUSTOMER_ID>-zone-<ZONE>:<PASSWORD>@brd.superproxy.io:33335

[build]
command = "pnpm run build"

# Secrets Deployment Instructions:
# ================================
# Deploy worker secrets to production with:
#   wrangler secret put YOUTUBE_API_KEY --env production
#   wrangler secret put CLOUDFLARE_SECRET_TOKEN --env production
#   wrangler secret put RESIDENTIAL_PROXY_URL --env production
#   wrangler secret put OPENROUTER_API_KEY --env production
#   wrangler secret put UPSTASH_REDIS_REST_URL --env production
#   wrangler secret put UPSTASH_REDIS_REST_TOKEN --env production
#   wrangler secret put DECODO_API_KEY --env production
#
# Upstash KV REST API endpoints (from Upstash console):
#   UPSTASH_REDIS_REST_URL: https://your-project-region.upstash.io
#   UPSTASH_REDIS_REST_TOKEN: Default::your-token-here
#
# This enables:
# - YouTube metadata extraction with geo-distributed proxy routing
# - YouTube transcript extraction with IP block bypass
# - LLM analysis with 5-tier cascade (Gemma → Laguna → GLM → Kimi → Haiku) via OpenRouter
# - 7-day Upstash KV caching for deterministic validated 12D analysis results
# - Resilient distributed content retrieval across Vercel + Workers + Supabase
