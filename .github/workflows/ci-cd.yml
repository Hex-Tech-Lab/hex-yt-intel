name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.9.0"
  PRODUCTION_URL: https://hex-yt-intel.vercel.app
  # Cache buster 2026-06-30T08:40:35Z - Forces fresh pnpm/ESLint caches

jobs:
  # ============================================================================
  # STAGE 1: SETUP & VALIDATION
  # ============================================================================
  setup:
    name: Setup & Validate
    runs-on: ubuntu-latest
    outputs:
      build-needed: ${{ steps.check-changes.outputs.build-needed }}
      db-migration-needed: ${{ steps.check-changes.outputs.db-migration-needed }}
    steps:
      - name: Cleanup Git Config
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all core.askPass || true

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Check for changes that require build
        id: check-changes
        run: |
          # Determine base for comparison: HEAD~1 for pushes, origin/main for PRs
          BASE_COMPARE="origin/main"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_COMPARE="HEAD~1"
          fi
          echo "Comparing against $BASE_COMPARE"

          if git diff --quiet $BASE_COMPARE HEAD -- 'web/' 'packages/' 'pnpm-workspace.yaml' 'pnpm-lock.yaml' '*.json' '*.ts'; then
            echo "build-needed=false" >> $GITHUB_OUTPUT
          else
            echo "build-needed=true" >> $GITHUB_OUTPUT
          fi

          if git diff --quiet $BASE_COMPARE HEAD -- 'supabase/migrations/'; then
            echo "db-migration-needed=false" >> $GITHUB_OUTPUT
          else
            echo "db-migration-needed=true" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # STAGE 2: QUALITY CHECKS (Type, Lint, Test)
  # ============================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Run type check
        run: pnpm --filter @hex-yt-intel/web run type-check

      - name: Upload type check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-check-report
          path: .turbo/coverage/

  worker-typecheck:
    name: Worker TypeCheck
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Run worker typecheck
        run: pnpm --filter youtube-intelligence-worker run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Run linter
        run: pnpm --filter @hex-yt-intel/web run lint

      - name: Run QA Intel Quality Gate
        run: pnpm dlx tsx scripts/verify-quality-engine.ts

      - name: Run Contract Auditor
        run: pnpm --filter @hex-yt-intel/web run contract-audit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment lint results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Linting failed. Please fix linting errors before merging.'
            })

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Run vitest unit suite
        run: pnpm --filter @hex-yt-intel/web run test:unit

  # ============================================================================
  # STAGE 3: BUILD VERIFICATION
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [setup, type-check, worker-typecheck, lint, unit-test]
    if: needs.setup.outputs.build-needed == 'true' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('web/app/**', 'web/components/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build web package
        run: pnpm --filter @hex-yt-intel/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.OPENROUTER_API_KEY || '' }}
          STRIPE_SECRET_KEY: ${{ github.event_name != 'pull_request' && secrets.STRIPE_SECRET_KEY || '' }}
          STRIPE_WEBHOOK_SECRET: ${{ github.event_name != 'pull_request' && secrets.STRIPE_WEBHOOK_SECRET || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          AUTH_PROVIDER: 'supabase'

      - name: Check build output
        run: |
          if [ ! -d "web/.next" ]; then
            echo "ERROR: Next.js build output (.next) not found"
            exit 1
          fi
          echo "✓ Build output verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            web/.next
            web/public

  # ============================================================================
  # STAGE 4: SECURITY & VALIDATION
  # ============================================================================
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Check for secrets in code
        run: |
          if grep -rE --exclude-dir=node_modules "\b(NEXT_PUBLIC_SUPABASE_ANON_KEY|OPENROUTER_API_KEY)\b" web/app --include="*.ts" --include="*.tsx" | grep -v "process.env\|import" | grep -v "undefined"; then
            echo "ERROR: Potential secrets found in code"
            exit 1
          fi
          echo "✓ No exposed secrets detected"

      - name: Check for hardcoded credentials
        run: |
          if grep -rE '\b(sk-[a-zA-Z0-9]{20,}|pk_live_[a-zA-Z0-9]{20,}|pk_test_[a-zA-Z0-9]{20,})' web --include="*.ts" --include="*.tsx" | grep -v "process.env"; then
            echo "ERROR: Hardcoded credentials found"
            exit 1
          fi
          echo "✓ No hardcoded credentials detected"

  env-validation:
    name: Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Validate environment configuration
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: pnpm --filter @hex-yt-intel/web exec tsx ../scripts/validate-env.js
        env:
          DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_SECRET_TOKEN: ${{ secrets.CLOUDFLARE_SECRET_TOKEN }}
          SKIP_ENV_VALIDATION: 'true'

  # ============================================================================
  # STAGE 5: DEPLOYMENT (Main/Master branch only)
  # ============================================================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [type-check, lint, unit-test, build, security-check, env-validation]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: production
      url: https://hex-yt-intel.vercel.app
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      # Composite setup so `pnpm dlx vercel` is available (this job didn't need
      # pnpm/node before — the amondnet action bundled its own runtime).
      - name: Setup environment
        uses: ./

      # Deploy via the official Vercel CLI. Replaces the unmaintained
      # amondnet/vercel-action, eliminating its deprecated `set-output` and
      # Node-20-runtime warnings. The CLI reads VERCEL_ORG_ID/VERCEL_PROJECT_ID
      # from env to target the project non-interactively.
      - name: Deploy to Vercel
        run: pnpm dlx vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deployment status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        # PR-only: on direct pushes to main there is no PR, so context.issue.number
        # is blank → POST to issues//comments → pipeline crash. Skip on push.
        if: always() && github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: status === 'success'
                ? '✅ Deployed to production: ' + process.env.PRODUCTION_URL
                : '❌ Deployment failed. Check workflow logs.'
            })

  # ============================================================================
  # STAGE 5.1: CRON REGISTRATION (Main/Master branch only)
  # ============================================================================
  cron-registration:
    name: Cron Registration
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Register Cron Job
        run: pnpm --filter @hex-yt-intel/web setup:cron
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}

  # ============================================================================
  # STAGE 6: DATABASE MIGRATION (Main/Master branch only)
  # ============================================================================
  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: |
      always() && !cancelled() &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      needs.setup.outputs.db-migration-needed == 'true' &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./  # TODO: fix missing .github/actions/ directory

      - name: Dry run database migrations
        run: |
          pnpm exec supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply database migrations
        run: |
          pnpm exec supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify database schema
        run: |
          pnpm exec supabase db query --linked "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ============================================================================
  # STAGE 7: POST-DEPLOYMENT VERIFICATION
  # ============================================================================
  production-health:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PRODUCTION_URL }}/api/health)
            if [ $STATUS -eq 200 ]; then
              echo "✓ Health check passed ($STATUS)"
              exit 0
            fi
            echo "Attempt $i/12: Status $STATUS, retrying..."
            sleep 5
          done
          echo "❌ Health check failed after 60 seconds"
          exit 1

      - name: Fetch health details
        if: always()
        run: |
          curl -s ${{ env.PRODUCTION_URL }}/api/health | jq '.'

      - name: Setup Node.js and pnpm for verification
        uses: ./

      - name: Install Playwright browsers for frontend verification
        run: pnpm --filter @hex-yt-intel/web exec playwright install --with-deps

      - name: Run comprehensive production verification
        run: ./scripts/verify-production.sh ${{ env.PRODUCTION_URL }}

      - name: Notify on failure
        # PR-only: same issues//comments crash guard as the deploy comment step —
        # this job runs on push to main where there is no PR to annotate.
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Production health check or verification failed. Investigate immediately.'
            })

  # ============================================================================
  # FINAL STATUS
  # ============================================================================
  final-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [type-check, lint, unit-test, build, security-check, env-validation]
    if: always()
    permissions:
      pull-requests: write
      contents: read
      checks: read
      security-events: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup environment
        uses: ./

      - name: Check pipeline status
        run: |
          if [[ "${{ needs.type-check.result }}" == "failure" || \
                "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" || \
                "${{ needs.security-check.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed"
            exit 1
          fi
          echo "✅ Pipeline passed"

      - name: Calculate PR Confidence
        id: confidence
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER=${{ github.event.pull_request.number }}

          # Create temp files for output separation using mktemp for secure creation
          TEMP_OUT=$(mktemp --suffix=.json)
          TEMP_ERR=$(mktemp --suffix=.log)

          # Trap ensures cleanup even if script exits prematurely
          trap "rm -f -- \"$TEMP_OUT\" \"$TEMP_ERR\"" EXIT

          # Run confidence calculator with proper error capture
          CALC_EXIT_CODE=0
          pnpm dlx tsx scripts/calculate-pr-confidence.ts --pr="$PR_NUMBER" > "$TEMP_OUT" 2> "$TEMP_ERR" || CALC_EXIT_CODE=$?

          if [ "$CALC_EXIT_CODE" -eq 0 ]; then
            # Success: extract JSON from stdout
            if [ -s "$TEMP_OUT" ]; then
              echo "✓ Confidence calculation succeeded"
              # Validate JSON before storing in environment variable
              if cat "$TEMP_OUT" | jq . > /dev/null 2>&1; then
                # Use multiline environment variable for safe JSON passing (avoids quote escaping)
                # Use quoted 'EOF' delimiter to prevent premature termination if JSON contains literal EOF
                {
                  echo "CONFIDENCE_JSON<<'EOF'"
                  cat "$TEMP_OUT"
                  echo "EOF"
                } >> "$GITHUB_ENV"
              else
                echo "⚠️  Warning: JSON validation failed, confidence score unavailable"
              fi
            else
              echo "⚠️  No output from confidence calculator"
            fi
          else
            # Failure: log error but continue (graceful degradation)
            echo "⚠️  Confidence calculation failed with exit code $CALC_EXIT_CODE"
            if [ -s "$TEMP_ERR" ]; then
              echo "Error details:"
              cat "$TEMP_ERR" >&2
            fi
          fi
        continue-on-error: true

      - name: Comment on PR with status and confidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            const statusEmoji = status === 'success' ? '✅' : '❌';

            let confidenceBody = '';
            let confidenceWarning = '';

            try {
              // Read JSON from environment variable (set via $GITHUB_ENV in shell step)
              const confidenceJson = process.env.CONFIDENCE_JSON || '';

              // Check if confidence calculation succeeded
              if (!confidenceJson || !confidenceJson.trim()) {
                confidenceWarning = '\n\n⚠️ **Note**: Confidence score calculation was skipped or failed. Check workflow logs for details.';
              } else if (confidenceJson.trim().startsWith('{')) {
                try {
                  const confidence = JSON.parse(confidenceJson);
                  const breakdown = confidence.breakdown;
                  const unverifiedLine = confidence.hasUnverifiedDimensions
                    ? `\n\n                  ⚠️ **Unverified dimensions (scored 0, not skipped): ${confidence.unverifiedDimensions.join(', ')}** — the calculator could not query these; treat the total below as a floor, not a confirmed score, and check workflow logs before trusting "${confidence.recommendation}".`
                    : '';

                  confidenceBody = `

                  ## 🎯 PR Confidence Score

                  **Confidence: ${confidence.confidence}%** — *${confidence.recommendation}*
                  ${unverifiedLine}

                  ### Scoring Breakdown
                  | Tool | Score | Max |
                  |---|---|---|
                  | Cubic | ${breakdown.cubic} | 30 |
                  | CodeRabbit | ${breakdown.coderabbit} | 20 |
                  | Snyk | ${breakdown.snyk} | 15 |
                  | CI/CD | ${breakdown.ci_cd} | 10 |
                  | Vercel | ${breakdown.vercel} | 5 |
                  | CodeQL | ${breakdown.codeql} | 5 |
                  | **Total** | **${breakdown.cubic + breakdown.coderabbit + breakdown.snyk + breakdown.ci_cd + breakdown.vercel + breakdown.codeql}** | **85** |

                  *Note: Confidence score is informational and does not block merging. Always conduct manual code review.*`;
                } catch (parseErr) {
                  console.error('Failed to parse confidence JSON:', parseErr.message);
                  confidenceWarning = '\n\n⚠️ **Note**: Confidence score calculation failed. Check workflow logs for details.';
                }
              } else {
                console.log('Unexpected confidence output format:', confidenceJson.substring(0, 100));
                confidenceWarning = '\n\n⚠️ **Note**: Confidence score calculation produced unexpected output. Check workflow logs.';
              }
            } catch (e) {
              console.error('Error processing confidence score:', e.message);
              confidenceWarning = '\n\n⚠️ **Note**: Error processing confidence score. Check workflow logs.';
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `${statusEmoji} **Pipeline Status**: ${status === 'success' ? 'All checks passed. Ready to merge.' : 'One or more checks failed. Not ready to merge.'}${confidenceBody}${confidenceWarning}`
              });
            } catch (commentErr) {
              console.error('Failed to post PR comment:', commentErr.message);
              throw commentErr;
            }
