name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.1.3"
  PRODUCTION_URL: https://hex-yt-intel.vercel.app

jobs:
  # ============================================================================
  # STAGE 1: SETUP & VALIDATION
  # ============================================================================
  setup:
    name: Setup & Validate
    runs-on: ubuntu-latest
    outputs:
      build-needed: ${{ steps.check-changes.outputs.build-needed }}
      db-migration-needed: ${{ steps.check-changes.outputs.db-migration-needed }}
    steps:
      - name: Cleanup Git Config
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all core.askPass || true

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Check for changes that require build
        id: check-changes
        run: |
          if git diff --quiet origin/main HEAD -- 'web/' 'packages/' '*.json' '*.ts'; then
            echo "build-needed=false" >> $GITHUB_OUTPUT
          else
            echo "build-needed=true" >> $GITHUB_OUTPUT
          fi

          if git diff --quiet origin/main HEAD -- 'supabase/migrations/'; then
            echo "db-migration-needed=false" >> $GITHUB_OUTPUT
          else
            echo "db-migration-needed=true" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # STAGE 2: QUALITY CHECKS (Type, Lint, Test)
  # ============================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Run type check
        run: pnpm --filter @hex-yt-intel/web run type-check

      - name: Upload type check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-check-report
          path: .turbo/coverage/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Run linter
        run: pnpm --filter @hex-yt-intel/web run lint

      - name: Comment lint results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Linting failed. Please fix linting errors before merging.'
            })

  # ============================================================================
  # STAGE 3: BUILD VERIFICATION
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [setup, type-check, lint]
    if: needs.setup.outputs.build-needed == 'true' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Cache Next.js build
        uses: actions/cache@d4323d4df104b026a6aa633f9c4b77615317652b # v4.2.2
        with:
          path: ${{ github.workspace }}/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('web/app/**', 'web/components/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build web package
        run: pnpm --filter @hex-yt-intel/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          AUTH_PROVIDER: 'supabase'

      - name: Check build output
        run: |
          if [ ! -d "web/.next" ]; then
            echo "ERROR: Next.js build output (.next) not found"
            exit 1
          fi
          echo "✓ Build output verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            web/.next
            web/public

  # ============================================================================
  # STAGE 4: SECURITY & VALIDATION
  # ============================================================================
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Check for secrets in code
        run: |
          if grep -rE --exclude-dir=node_modules "\b(NEXT_PUBLIC_SUPABASE_ANON_KEY|OPENROUTER_API_KEY)\b" web/app --include="*.ts" --include="*.tsx" | grep -v "process.env\|import" | grep -v "undefined"; then
            echo "ERROR: Potential secrets found in code"
            exit 1
          fi
          echo "✓ No exposed secrets detected"

      - name: Check for hardcoded credentials
        run: |
          if grep -rE '\b(sk-[a-zA-Z0-9]{20,}|pk_live_[a-zA-Z0-9]{20,}|pk_test_[a-zA-Z0-9]{20,})' web --include="*.ts" --include="*.tsx" | grep -v "process.env"; then
            echo "ERROR: Hardcoded credentials found"
            exit 1
          fi
          echo "✓ No hardcoded credentials detected"

  env-validation:
    name: Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Validate environment configuration
        run: pnpm --filter @hex-yt-intel/web exec tsx lib/env.ts

  # ============================================================================
  # STAGE 5: DEPLOYMENT (Main/Master branch only)
  # ============================================================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [type-check, lint, build, security-check, env-validation]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@c31f44fa7eb28f5a12b29ea3a80f3a8df1c18c6f # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Comment deployment status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: status === 'success'
                ? '✅ Deployed to production: ' + process.env.PRODUCTION_URL
                : '❌ Deployment failed. Check workflow logs.'
            })

  # ============================================================================
  # STAGE 6: DATABASE MIGRATION (Main/Master branch only)
  # ============================================================================
  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: |
      always() && !cancelled() &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      needs.setup.outputs.db-migration-needed == 'true' &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Hex Intel Environment
        uses: ./

      - name: Check for pending migrations
        run: |
          npx supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry run database migrations
        run: |
          npx supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply database migrations
        run: |
          npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify database schema
        run: |
          npx supabase db execute "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ============================================================================
  # STAGE 7: POST-DEPLOYMENT VERIFICATION
  # ============================================================================
  production-health:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PRODUCTION_URL }}/api/health)
            if [ $STATUS -eq 200 ]; then
              echo "✓ Health check passed ($STATUS)"
              exit 0
            fi
            echo "Attempt $i/12: Status $STATUS, retrying..."
            sleep 5
          done
          echo "❌ Health check failed after 60 seconds"
          exit 1

      - name: Fetch health details
        if: always()
        run: |
          curl -s ${{ env.PRODUCTION_URL }}/api/health | jq '.'

      - name: Setup Node.js and pnpm for verification
        uses: ./

      - name: Install Playwright browsers for frontend verification
        run: pnpm --filter @hex-yt-intel/web exec playwright install --with-deps

      - name: Run comprehensive production verification
        run: ./scripts/verify-production.sh ${{ env.PRODUCTION_URL }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Production health check or verification failed. Investigate immediately.'
            })

  # ============================================================================
  # FINAL STATUS
  # ============================================================================
  final-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [type-check, lint, build, security-check, env-validation]
    if: always()
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check pipeline status
        run: |
          if [[ "${{ needs.type-check.result }}" == "failure" || \
                "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" || \
                "${{ needs.security-check.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed"
            exit 1
          fi
          echo "✅ Pipeline passed"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            const statusEmoji = status === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${statusEmoji} **Pipeline Status**: All checks passed. Ready to merge.`
            })
