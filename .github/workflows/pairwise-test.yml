name: Pairwise Test Matrix (Waves 1-4)

on:
  push:
    branches:
      - main
      - cc/pairwise-automation-phase-2
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pairwise-tests:
    name: Run Pairwise Test Suite (38 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: test

    env:
      AUTH_PROVIDER: supabase
      CI: true
      NODE_ENV: test
      BASE_URL: http://localhost:3000
      DEV_BYPASS_TOKEN: test-token
      ALLOW_DEV_BYPASS: 'true'
      DEV_TEST_USER_EMAIL: kellybakri@gmail.com
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Purge build cache
        run: rm -rf web/.next web/.turbo .turbo

      - name: Build application
        run: pnpm --filter @hex-yt-intel/web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: dummy-url-for-build
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-build

      - name: Install Playwright Browsers
        run: pnpm --filter @hex-yt-intel/web exec playwright install --with-deps

      - name: Seed test user to Supabase
        run: |
          cat > /tmp/seed-test-user.js << 'SEED_EOF'
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );
          (async () => {
            try {
              const { error } = await supabase.from('users').insert({
                id: 'da4381c6-f774-4c99-8f04-2c1c9e27d1fb',
                email: 'kellybakri@gmail.com',
                tier: 'free',
                analyses_used: 0,
                last_reset_date: new Date().toISOString(),
                created_at: new Date().toISOString(),
              }).on('*', payload => {}).throwOnError();
              if (error) throw error;
              console.log('✓ Test user seeded successfully');
              process.exit(0);
            } catch (err) {
              console.error('Error seeding test user:', err.message);
              process.exit(1);
            }
          })();
          SEED_EOF
          node /tmp/seed-test-user.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Playwright pairwise tests
        run: pnpm --filter @hex-yt-intel/web exec playwright test --config=playwright.config.ts
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results.json
          retention-days: 30

      - name: Log test summary
        if: always()
        run: |
          echo "Test execution complete. Results available in artifacts."
          if [ -f web/test-results.json ]; then
            echo "✓ Test results JSON artifact created"
          fi

  coverage-report:
    name: Generate Coverage Matrix
    runs-on: ubuntu-latest
    needs: pairwise-tests
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-test-results

      - name: Parse results and generate matrix
        run: |
          echo "## Pairwise Test Coverage Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Cases**: 38" >> $GITHUB_STEP_SUMMARY
          echo "**Categories**: 6 (Happy Path, Error Handling, Auth, Quota, Cache, Middleware)" >> $GITHUB_STEP_SUMMARY
          echo "**Dimensions Covered**: 7 (Environment, Auth Provider, Rate Tier, Error Scenario, Cache State, API Endpoint, Middleware Type)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $(grep -c '"status": "passed"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $(grep -c '"status": "failed"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $(grep -c '"status": "skipped"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
