name: Pairwise Test Matrix (Waves 1-4)

on:
  push:
    branches:
      - main
      - cc/pairwise-automation-phase-2
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pairwise-tests:
    name: Run Pairwise Test Suite (38 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: test

    env:
      CI: true
      NODE_ENV: test
      BASE_URL: http://localhost:3000
      DEV_BYPASS_TOKEN: ${{ secrets.DEV_BYPASS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @hex-yt-intel/web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: dummy-url-for-build
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-build

      - name: Start Next.js development server
        run: |
          pnpm --filter @hex-yt-intel/web run dev &
          sleep 5
          curl -f http://localhost:3000 || exit 1
        timeout-minutes: 5

      - name: Run Playwright pairwise tests
        run: pnpm --filter @hex-yt-intel/web exec playwright test --config=playwright.config.ts tests/pairwise/
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results.json
          retention-days: 30

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-videos
          path: web/test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Pairwise Test Results
          path: web/test-results.json
          reporter: 'java-junit'
          fail-on-error: false

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Pairwise test suite failed on ${{ github.ref }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,ref,commit,message

  coverage-report:
    name: Generate Coverage Matrix
    runs-on: ubuntu-latest
    needs: pairwise-tests
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-test-results

      - name: Parse results and generate matrix
        run: |
          echo "## Pairwise Test Coverage Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Cases**: 38" >> $GITHUB_STEP_SUMMARY
          echo "**Categories**: 6 (Happy Path, Error Handling, Auth, Quota, Cache, Middleware)" >> $GITHUB_STEP_SUMMARY
          echo "**Dimensions Covered**: 7 (Environment, Auth Provider, Rate Tier, Error Scenario, Cache State, API Endpoint, Middleware Type)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $(grep -c '"status": "passed"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $(grep -c '"status": "failed"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $(grep -c '"status": "skipped"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
