name: Pairwise Test Matrix (Waves 1-4)

on:
  schedule:
    # Weekly comprehensive test run (Sunday 1:00 AM UTC)
    - cron: '0 1 * * 0'
  workflow_dispatch: # Allow manual triggering if needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pairwise-tests:
    name: Run Pairwise Test Suite (38 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PNPM_VERSION: "11.5.1"
      AUTH_PROVIDER: supabase
      CI: true
      NODE_ENV: test
      BASE_URL: http://localhost:3000
      DEV_BYPASS_TOKEN: ${{ secrets.DEV_BYPASS_TOKEN || 'test-token' }}
      ALLOW_DEV_BYPASS: 'true'
      DEV_TEST_USER_EMAIL: ${{ secrets.DEV_TEST_USER_EMAIL }}
      RUN_PAIRWISE: 'true'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Purge build cache
        run: rm -rf web/.next web/.turbo .turbo

      - name: Build application
        run: pnpm --filter @hex-yt-intel/web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key

      - name: Install Playwright Browsers
        run: pnpm --filter @hex-yt-intel/web exec playwright install --with-deps

      - name: Run Playwright pairwise tests
        run: pnpm --filter @hex-yt-intel/web exec playwright test tests/pairwise_matrix/
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@4ced503f3750d52f35215978e74177d75ee70745 # v4.5.0
        with:
          name: playwright-test-results
          path: web/test-results.json
          retention-days: 30

      - name: Log test summary
        if: always()
        run: |
          echo "Test execution complete. Results available in artifacts."
          if [ -f web/test-results.json ]; then
            echo "✓ Test results JSON artifact created"
          fi

  coverage-report:
    name: Generate Coverage Matrix
    runs-on: ubuntu-latest
    needs: pairwise-tests
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: playwright-test-results

      - name: Parse results and generate matrix
        run: |
          echo "## Pairwise Test Coverage Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Cases**: 38" >> $GITHUB_STEP_SUMMARY
          echo "**Categories**: 6 (Happy Path, Error Handling, Auth, Quota, Cache, Middleware)" >> $GITHUB_STEP_SUMMARY
          echo "**Dimensions Covered**: 7 (Environment, Auth Provider, Rate Tier, Error Scenario, Cache State, API Endpoint, Middleware Type)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $(grep -c '"status": "passed"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $(grep -c '"status": "failed"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $(grep -c '"status": "skipped"' test-results.json || echo '0') |" >> $GITHUB_STEP_SUMMARY
