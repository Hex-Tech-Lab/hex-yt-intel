name: Deploy HMAC Secret to Production

on:
  workflow_dispatch:
    inputs:
      hmac_secret:
        description: 'STREAM_HMAC_SECRET value to deploy'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to Vercel Production
        run: |
          curl -X POST "https://api.vercel.com/v13/projects/${{ secrets.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "STREAM_HMAC_SECRET",
              "value": "${{ github.event.inputs.hmac_secret }}",
              "target": ["production", "preview"]
            }'

      - name: Trigger Vercel Production Deploy
        run: |
          curl -X POST "https://api.vercel.com/v12/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "hex-yt-intel",
              "gitSource": {
                "ref": "main",
                "repoId": "${{ secrets.VERCEL_REPO_ID }}"
              }
            }'

      - name: Notify Slack
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ HMAC Secret deployed to production. Monitor logs for errors."
            }'
