name: Deploy HMAC Secret to Production

on:
  workflow_dispatch:
    inputs:
      hmac_secret:
        description: 'STREAM_HMAC_SECRET value to deploy'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # RCA (2026-08-14): this workflow has silently no-op'd since it was
      # written -- both Vercel API calls were missing a required `type`
      # field, and plain curl without --fail-with-body exits 0 on a 4xx
      # response body, so every past run reported green while never actually
      # setting the Vercel env var. Root cause of a live STREAM_HMAC_SECRET
      # drift between Vercel and the Worker that broke streaming analysis in
      # production. Fixed: real required fields, --fail-with-body so a bad
      # response fails the job loudly, and (this revision) upsert semantics
      # -- Vercel's env POST is create-only and 400s with ENV_CONFLICT if the
      # key already exists for that target, discovered on the first real
      # (non-silently-failing) run of the corrected workflow. Must look up
      # the existing var's id and PATCH it instead of blindly POSTing.
      - name: Upsert STREAM_HMAC_SECRET on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HMAC_SECRET: ${{ github.event.inputs.hmac_secret }}
        run: |
          set -euo pipefail
          EXISTING_ID=$(curl --fail-with-body -s \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?decrypt=false" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            | jq -r '.envs[] | select(.key=="STREAM_HMAC_SECRET" and (.target | index("production"))) | .id' | head -n1)

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Updating existing env var id=${EXISTING_ID}"
            curl --fail-with-body -X PATCH "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${EXISTING_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"value\": \"${HMAC_SECRET}\", \"target\": [\"production\", \"preview\"]}"
          else
            echo "No existing var found, creating"
            curl --fail-with-body -X POST "https://api.vercel.com/v13/projects/${VERCEL_PROJECT_ID}/env" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\": \"STREAM_HMAC_SECRET\", \"value\": \"${HMAC_SECRET}\", \"type\": \"encrypted\", \"target\": [\"production\", \"preview\"]}"
          fi

      - name: Trigger Vercel Production Deploy
        run: |
          curl --fail-with-body -X POST "https://api.vercel.com/v12/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "hex-yt-intel",
              "gitSource": {
                "type": "github",
                "ref": "main",
                "repoId": "${{ secrets.VERCEL_REPO_ID }}"
              }
            }'

      - name: Notify Slack
        if: success() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl --fail-with-body -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ HMAC Secret deployed to production. Monitor logs for errors."
            }'
