name: Deploy HMAC Secret to Production

on:
  workflow_dispatch:
    inputs:
      hmac_secret:
        description: 'STREAM_HMAC_SECRET value to deploy'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # RCA (2026-08-14): this workflow has silently no-op'd since it was
      # written -- both Vercel API calls below were missing a required
      # `type` field (env API needs type=encrypted; deployments API's
      # gitSource needs type=github), and plain `curl` without --fail-with-body
      # exits 0 on a 4xx response body, so every past run reported green while
      # never actually setting the Vercel env var. Root cause of a live
      # STREAM_HMAC_SECRET drift between Vercel and the Worker that broke
      # streaming analysis in production. Fixed: real required fields, and
      # --fail-with-body so a bad response now fails the job loudly instead
      # of silently.
      - name: Deploy to Vercel Production
        run: |
          curl --fail-with-body -X POST "https://api.vercel.com/v13/projects/${{ secrets.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "STREAM_HMAC_SECRET",
              "value": "${{ github.event.inputs.hmac_secret }}",
              "type": "encrypted",
              "target": ["production", "preview"]
            }'

      - name: Trigger Vercel Production Deploy
        run: |
          curl --fail-with-body -X POST "https://api.vercel.com/v12/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "hex-yt-intel",
              "gitSource": {
                "type": "github",
                "ref": "main",
                "repoId": "${{ secrets.VERCEL_REPO_ID }}"
              }
            }'

      - name: Notify Slack
        if: success() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl --fail-with-body -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ HMAC Secret deployed to production. Monitor logs for errors."
            }'
