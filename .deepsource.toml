version = 1

[analyzers.javascript]
environment = ["nodejs"]

[analyzers.meta]
# Both declaration forms are exempted from the Documentation Coverage metric:
# "function-declaration" since the metric first shipped on this repo, and
# "arrow-function" added 2026-09-19 (PR #314): the JS analyzer counts inline
# arrow callbacks as functions for this metric, so any PR touching the
# callback-heavy persist route / test files crashes the metric to ~0.4% vs the
# ~49% repo baseline and fails the check ("failing metrics") regardless of
# how well-documented the new module-level exports are. Documented fn
# declarations remain the repo's convention; this only stops anonymous
# inline arrows from being scored.
skip_doc_coverage = ["function-declaration", "arrow-function"]

# Note: JS-0857 (non-null assertions), JS-0827/JS-0838 (console logging)
# are suppressed via skipcq inline comments in source files
