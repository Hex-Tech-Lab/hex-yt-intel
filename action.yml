name: 'Hex Intel Environment'
description: 'Standardized setup, caching, and install for monorepo'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 11.1.3
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install dependencies
      shell: bash
      run: pnpm install --recursive --frozen-lockfile
