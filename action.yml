name: 'Hex Intel Environment'
description: 'Standardized setup, caching, and install for monorepo'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.9.0
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '24.x'
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'
    - name: Install dependencies
      shell: bash
      env:
        PNPM_CONFIG_AUTO_INSTALL_PEERS: "true"
      run: pnpm install --frozen-lockfile
