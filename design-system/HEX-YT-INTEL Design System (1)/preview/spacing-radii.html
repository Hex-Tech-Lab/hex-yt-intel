<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<style>
.row { display:flex; gap:18px; margin-top:16px; align-items:flex-end; }
.item { display:flex; flex-direction:column; align-items:center; gap:8px; }
.demo { background:var(--surface); border:1px solid var(--line-strong); }
.r8 { width:84px; height:54px; border-radius:8px; }
.r16 { width:84px; height:54px; border-radius:16px; }
.rpill { width:104px; height:38px; border-radius:9999px; }
.l { font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); text-align:center; }
.l b { color:var(--ink); font-weight:500; display:block; }
</style></head>
<body>
<div class="cap"><span class="i">// </span>radii · capped at 16px on cards</div>
<div class="row">
  <div class="item"><div class="demo r8"></div><div class="l"><b>control</b>8px</div></div>
  <div class="item"><div class="demo r16"></div><div class="l"><b>card</b>16px max</div></div>
  <div class="item"><div class="demo rpill"></div><div class="l"><b>pill</b>tags · chips</div></div>
</div>
<div class="tiny" style="margin-top:16px; color:var(--ink-secondary)">No 24/28/32px+ on cards. 4px reserved for hairline insets only.</div>
</body></html>
