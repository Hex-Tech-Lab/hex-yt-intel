<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
.row { display:flex; gap:18px; margin-top:16px; }
.frame { position:relative; flex:1; height:96px; }
.frame .arm { position:absolute; width:16px; height:16px; pointer-events:none; }
.frame .inner { position:absolute; inset:6px; background:var(--surface); border-radius:12px; display:grid; place-items:center; color:var(--ink-secondary); }
.tl { top:0; left:0; border-top:1.5px solid; border-left:1.5px solid; }
.tr { top:0; right:0; border-top:1.5px solid; border-right:1.5px solid; }
.bl { bottom:0; left:0; border-bottom:1.5px solid; border-left:1.5px solid; }
.br { bottom:0; right:0; border-bottom:1.5px solid; border-right:1.5px solid; }
.line .arm { color:rgb(51 65 85 / 0.6); }
.accent .arm { color:rgb(6 182 212 / 0.7); }
.l { font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); margin-top:8px; text-align:center; }
</style></head>
<body>
<div class="cap"><span class="i">// </span>scope-bracket · the instrument viewport motif</div>
<div class="row">
  <div class="col" style="flex:1">
    <div class="frame line"><span class="arm tl"></span><span class="arm tr"></span><span class="arm bl"></span><span class="arm br"></span><div class="inner"><iconify-icon icon="solar:gallery-linear" style="font-size:22px"></iconify-icon></div></div>
    <div class="l">tone="line" · neutral region</div>
  </div>
  <div class="col" style="flex:1">
    <div class="frame accent"><span class="arm tl"></span><span class="arm tr"></span><span class="arm bl"></span><span class="arm br"></span><div class="inner" style="color:var(--accent)"><iconify-icon icon="solar:bolt-linear" style="font-size:22px"></iconify-icon></div></div>
    <div class="l">tone="accent" · focal / active</div>
  </div>
</div>
</body></html>
