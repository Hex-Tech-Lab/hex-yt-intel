<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<style>
.ramp { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:14px; }
.cell { border-radius:10px; border:1px solid var(--line); overflow:hidden; }
.chip { height:64px; }
.meta { padding:8px 10px; }
.name { font-size:12px; color:var(--ink); font-weight:500; }
.hex { font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); margin-top:2px; }
</style></head>
<body>
<div class="cap"><span class="i">// </span>surface ramp · obsidian → slate</div>
<div class="ramp">
  <div class="cell"><div class="chip" style="background:var(--void)"></div><div class="meta"><div class="name">void</div><div class="hex">#0B0E14</div></div></div>
  <div class="cell"><div class="chip" style="background:var(--bg)"></div><div class="meta"><div class="name">bg / canvas</div><div class="hex">#11141D</div></div></div>
  <div class="cell"><div class="chip" style="background:var(--surface)"></div><div class="meta"><div class="name">surface ★</div><div class="hex">#1A1F2B</div></div></div>
  <div class="cell"><div class="chip" style="background:var(--surface-raised)"></div><div class="meta"><div class="name">raised</div><div class="hex">#1F2533</div></div></div>
  <div class="cell"><div class="chip" style="background:#0f172a80"></div><div class="meta"><div class="name">card</div><div class="hex">slate-900/50</div></div></div>
</div>
</body></html>
