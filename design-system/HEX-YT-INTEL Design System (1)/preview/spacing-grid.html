<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<style>
.scale { margin-top:14px; display:flex; align-items:flex-end; gap:12px; }
.u { display:flex; flex-direction:column; align-items:center; gap:7px; }
.bar { background:var(--accent-strong); border-radius:3px; width:100%; }
.u .l { font-family:var(--font-mono); font-size:10px; color:var(--ink-muted); }
.u .v { font-family:var(--font-mono); font-size:11px; color:var(--ink); }
</style></head>
<body>
<div class="cap"><span class="i">// </span>spacing · 8px grid</div>
<div class="scale">
  <div class="u" style="width:18px"><div class="bar" style="height:8px"></div><div class="v">2</div><div class="l">8</div></div>
  <div class="u" style="width:26px"><div class="bar" style="height:16px"></div><div class="v">4</div><div class="l">16</div></div>
  <div class="u" style="width:34px"><div class="bar" style="height:24px"></div><div class="v">6</div><div class="l">24</div></div>
  <div class="u" style="width:42px"><div class="bar" style="height:32px"></div><div class="v">8</div><div class="l">32</div></div>
  <div class="u" style="width:54px"><div class="bar" style="height:48px"></div><div class="v">12</div><div class="l">48</div></div>
  <div class="u" style="width:70px"><div class="bar" style="height:64px"></div><div class="v">16</div><div class="l">64</div></div>
  <div class="u" style="width:86px"><div class="bar" style="height:80px"></div><div class="v">20</div><div class="l">80</div></div>
</div>
</body></html>
