<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
.nav { margin-top:14px; display:flex; flex-direction:column; gap:3px; max-width:230px; }
.item { display:flex; align-items:center; gap:11px; padding:8px 11px; border-radius:8px; font-size:13.5px; color:var(--ink-secondary); cursor:pointer; }
.item iconify-icon { font-size:17px; }
.item .ct { margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); }
.item.active { background:rgb(6 182 212 / 0.10); color:var(--ink); }
.item.active iconify-icon { color:var(--accent); }
.item.hover { background:rgb(30 41 59 / 0.4); color:var(--ink); }
.lab { font-family:var(--font-mono); font-size:9.5px; color:var(--ink-muted); margin-left:11px; }
</style></head>
<body>
<div class="cap"><span class="i">// </span>sidebar nav · item states</div>
<div class="nav">
  <div class="item active"><iconify-icon icon="solar:home-2-linear"></iconify-icon>Console</div>
  <div class="lab">active · cyan icon + accent/10</div>
  <div class="item hover"><iconify-icon icon="solar:folder-with-files-linear"></iconify-icon>Saved analyses<span class="ct">12</span></div>
  <div class="lab">hover · line/40 + ink</div>
  <div class="item"><iconify-icon icon="solar:magnifer-linear"></iconify-icon>Semantic search</div>
  <div class="lab">default · slate-400</div>
</div>
</body></html>
