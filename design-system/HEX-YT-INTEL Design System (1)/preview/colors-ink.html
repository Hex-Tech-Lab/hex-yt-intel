<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<style>
.list { margin-top:14px; display:flex; flex-direction:column; gap:12px; }
.item { display:flex; align-items:center; gap:14px; }
.sw { width:48px; height:48px; border-radius:10px; border:1px solid var(--line); flex:none; }
.label .n { font-size:14px; }
.label .h { font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); margin-top:2px; }
.spec { margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); }
</style></head>
<body>
<div class="cap"><span class="i">// </span>ink · text on #1A1F2B</div>
<div class="list">
  <div class="item"><div class="sw" style="background:var(--ink)"></div><div class="label"><div class="n" style="color:var(--ink)">Primary text — slate-200</div><div class="h">#E2E8F0</div></div><div class="spec">AAA · 11.9:1</div></div>
  <div class="item"><div class="sw" style="background:var(--ink-secondary)"></div><div class="label"><div class="n" style="color:var(--ink-secondary)">Secondary text — slate-400</div><div class="h">#94A3B8</div></div><div class="spec">AA · 5.8:1</div></div>
  <div class="item"><div class="sw" style="background:var(--ink-muted)"></div><div class="label"><div class="n" style="color:var(--ink-muted)">Muted / label — slate-500</div><div class="h">#64748B</div></div><div class="spec">label only · 3.4:1</div></div>
</div>
</body></html>
