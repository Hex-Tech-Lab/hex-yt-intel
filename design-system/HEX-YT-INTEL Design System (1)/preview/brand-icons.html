<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
.grid { margin-top:14px; display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.ic { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.ic iconify-icon { font-size:22px; color:var(--ink-secondary); }
.ic .l { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.04em; color:var(--ink-muted); text-align:center; }
.note { margin-top:13px; font-size:11.5px; color:var(--ink-secondary); }
</style></head>
<body>
<div class="cap"><span class="i">// </span>iconography · Solar (linear) via Iconify</div>
<div class="grid">
  <div class="ic"><iconify-icon icon="solar:target-linear"></iconify-icon><span class="l">thesis</span></div>
  <div class="ic"><iconify-icon icon="solar:chat-square-like-linear"></iconify-icon><span class="l">arguments</span></div>
  <div class="ic"><iconify-icon icon="solar:database-linear"></iconify-icon><span class="l">evidence</span></div>
  <div class="ic"><iconify-icon icon="solar:widget-5-linear"></iconify-icon><span class="l">frameworks</span></div>
  <div class="ic"><iconify-icon icon="solar:users-group-rounded-linear"></iconify-icon><span class="l">entities</span></div>
  <div class="ic"><iconify-icon icon="solar:bolt-linear"></iconify-icon><span class="l">tactics</span></div>
  <div class="ic"><iconify-icon icon="solar:shuffle-linear"></iconify-icon><span class="l">contrarian</span></div>
  <div class="ic"><iconify-icon icon="solar:question-circle-linear"></iconify-icon><span class="l">questions</span></div>
  <div class="ic"><iconify-icon icon="solar:checklist-minimalistic-linear"></iconify-icon><span class="l">actions</span></div>
  <div class="ic"><iconify-icon icon="solar:quote-up-linear"></iconify-icon><span class="l">quotes</span></div>
  <div class="ic"><iconify-icon icon="solar:graph-linear"></iconify-icon><span class="l">connections</span></div>
  <div class="ic"><iconify-icon icon="solar:graph-up-linear"></iconify-icon><span class="l">brand mark</span></div>
</div>
<div class="note">Thin uniform stroke. The 11 UCIS dimension glyphs + the brand mark. No emoji, no hand-drawn SVG.</div>
</body></html>
