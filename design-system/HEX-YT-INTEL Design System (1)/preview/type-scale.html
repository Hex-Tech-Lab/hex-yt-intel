<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<style>
.scale { margin-top:12px; display:flex; flex-direction:column; gap:7px; }
.s { display:flex; align-items:baseline; gap:14px; }
.s .px { font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); width:40px; flex:none; text-align:right; }
.s .t { color:var(--ink); font-weight:500; letter-spacing:-0.02em; line-height:1; white-space:nowrap; }
</style></head>
<body>
<div class="cap"><span class="i">// </span>type scale · major third</div>
<div class="scale">
  <div class="s"><span class="px">60</span><span class="t" style="font-size:34px">Synthesis</span></div>
  <div class="s"><span class="px">36</span><span class="t" style="font-size:30px">Synthesis console</span></div>
  <div class="s"><span class="px">24</span><span class="t" style="font-size:24px">Key arguments</span></div>
  <div class="s"><span class="px">18</span><span class="t" style="font-size:18px">Lead paragraph copy</span></div>
  <div class="s"><span class="px">16</span><span class="t" style="font-size:16px; font-weight:400">Body paragraph copy</span></div>
  <div class="s"><span class="px">12</span><span class="t mono" style="font-size:12px; font-weight:600; color:var(--ink-muted)">11 / 12 · MONO LABEL</span></div>
</div>
</body></html>
