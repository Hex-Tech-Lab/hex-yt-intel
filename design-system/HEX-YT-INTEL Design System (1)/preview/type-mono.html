<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<style>
.rows { margin-top:14px; display:flex; flex-direction:column; gap:11px; }
.r { display:flex; align-items:center; gap:14px; }
.r .ex { font-family:var(--font-mono); font-weight:600; color:var(--ink); }
.r .d { font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); }
.chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:rgb(26 31 43 / 0.6); border-radius:9999px; padding:4px 10px; font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.08em; color:var(--accent-ink); }
.dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
</style></head>
<body>
<div class="cap"><span class="i">// </span>mono register · JetBrains Mono · tabular-nums</div>
<div class="rows">
  <div class="r"><span class="ex hx-mono-label" style="font-size:11px"><span class="hx-mono-index">// </span>SYNTHESIS CONSOLE</span><span class="d">label · 0.12em uppercase</span></div>
  <div class="r"><span class="ex" style="font-size:13px">07 / 11 complete</span><span class="d">counts · tabular</span></div>
  <div class="r"><span class="ex" style="font-size:12px; color:var(--ink-secondary)">14:02:09  transcript fetched</span><span class="d">log line</span></div>
  <div class="r"><span class="chip"><span class="dot"></span>STREAMING</span><span class="d">status chip</span></div>
</div>
</body></html>
