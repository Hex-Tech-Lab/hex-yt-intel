<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/><link rel="stylesheet" href="_card.css"/>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
@property --hx-angle { syntax:"<angle>"; initial-value:0deg; inherits:false; }
@keyframes hx-rotate-ring { to { --hx-angle:360deg; } }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:14px; }
.cell { position:relative; padding:1px; border-radius:16px; overflow:hidden; background:linear-gradient(135deg, rgb(148 163 184 / 0.18) 0%, rgb(148 163 184 / 0) 60%); }
.cell.streaming { background:transparent; }
.cell .spin { position:absolute; inset:-40%; background:conic-gradient(from var(--hx-angle), transparent 55%, var(--accent) 78%, transparent 92%); animation:hx-rotate-ring 3s linear infinite; }
.inner { position:relative; background:var(--surface); border-radius:15px; padding:14px; height:96px; box-sizing:border-box; }
.cell.error .inner { box-shadow:inset 0 0 0 1px rgb(239 68 68 / 0.4); }
.hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.key { font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-muted); }
.key .ix { color:rgb(6 182 212 / 0.7); }
.ic { display:grid; place-items:center; width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink-secondary); font-size:15px; }
.ic.on { color:var(--accent); }
.sk { height:7px; border-radius:9999px; background:rgb(51 65 85 / 0.5); margin-bottom:7px; }
.body { font-size:12px; color:var(--ink-secondary); line-height:1.5; }
.err { font-family:var(--font-mono); font-size:11px; color:var(--err); }
.lab { font-family:var(--font-mono); font-size:9.5px; color:var(--ink-muted); margin-top:6px; }
</style></head>
<body>
<div class="cap"><span class="i">// </span>dimension card · state-driven bento cell</div>
<div class="grid">
  <div><div class="cell"><div class="inner"><div class="hd"><span class="key"><span class="ix">02</span> EVIDENCE</span><span class="ic"><iconify-icon icon="solar:database-linear"></iconify-icon></span></div><div class="sk" style="width:84%"></div><div class="sk" style="width:62%"></div></div></div><div class="lab">idle · skeleton</div></div>
  <div><div class="cell streaming"><span class="spin"></span><div class="inner"><div class="hd"><span class="key"><span class="ix">06</span> TACTICS</span><span class="ic on"><iconify-icon icon="solar:bolt-linear"></iconify-icon></span></div><div class="sk" style="width:90%"></div><div class="sk" style="width:55%"></div></div></div><div class="lab">streaming · scope-ring</div></div>
  <div><div class="cell"><div class="inner"><div class="hd"><span class="key"><span class="ix">01</span> CORE THESIS</span><span class="ic"><iconify-icon icon="solar:target-linear"></iconify-icon></span></div><div class="body">The creator argues that retention, not reach, compounds a channel's long-term value.</div></div></div><div class="lab">done · content</div></div>
  <div><div class="cell error"><div class="inner"><div class="hd"><span class="key"><span class="ix">09</span> ACTIONS</span><span class="ic"><iconify-icon icon="solar:checklist-minimalistic-linear"></iconify-icon></span></div><div class="err">Synthesis failed. Retry available.</div></div></div><div class="lab">error · red hairline</div></div>
</div>
</body></html>
