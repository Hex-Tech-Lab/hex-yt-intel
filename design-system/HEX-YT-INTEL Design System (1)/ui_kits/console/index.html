<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEX-YT-INTEL — Synthesis Console</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-sans); }
    #root { display: flex; height: 100vh; }
    .shell { display: flex; flex-direction: column; flex: 1; background: var(--bg); }
    .content { display: flex; flex: 1; overflow: hidden; }
    .main { flex: 1; overflow-y: auto; padding: 32px; max-width: 1280px; margin: 0 auto; width: 100%; }
    .main > * + * { margin-top: 40px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Primitives
    function Icon({ icon, size = 16, className = "", style = {} }) {
      return <iconify-icon icon={icon} className={className} style={{ fontSize: size, ...style }} />;
    }

    function GlowBorder({ children, active = false, radius = "card", className = "", style = {} }) {
      const r = radius === "card" ? 16 : 8;
      return (
        <div
          className={`hx-glow ${className}`}
          data-active={active}
          style={{
            position: "relative",
            padding: 1,
            borderRadius: r,
            overflow: "hidden",
            background: active ? "transparent" : "linear-gradient(135deg, rgb(148 163 184 / 0.18) 0%, rgb(148 163 184 / 0) 60%)",
            ...style,
          }}
        >
          {active && (
            <span
              aria-hidden="true"
              className="hx-spin"
              style={{
                position: "absolute",
                inset: "-40%",
                background: "conic-gradient(from var(--hx-angle), transparent 55%, var(--accent) 78%, transparent 92%)",
                animation: "hx-rotate-ring 3s linear infinite",
              }}
            />
          )}
          <div
            style={{
              position: "relative",
              borderRadius: r - 1,
              height: "100%",
              width: "100%",
            }}
          >
            {children}
          </div>
        </div>
      );
    }

    function MonoLabel({ children, index, className = "", style = {} }) {
      return (
        <span className={`hx-mono-label ${className}`} style={{ display: "inline-flex", alignItems: "center", gap: 8, ...style }}>
          {index && <span className="hx-mono-index" style={{ color: "rgb(6 182 212 / 0.7)" }}>{index}</span>}
          {children}
        </span>
      );
    }

    const STATUS_MAP = {
      idle: { label: "IDLE", dot: "var(--ink-muted)", text: "var(--ink-muted)", pulse: false },
      streaming: { label: "STREAMING", dot: "var(--accent)", text: "var(--accent-ink)", pulse: true },
      done: { label: "DONE", dot: "var(--ok)", text: "var(--ink-secondary)", pulse: false },
      error: { label: "ERROR", dot: "var(--err)", text: "var(--err)", pulse: false },
    };

    function StatusBadge({ status, label, style = {} }) {
      const s = STATUS_MAP[status] || STATUS_MAP.idle;
      return (
        <span
          style={{
            display: "inline-flex",
            alignItems: "center",
            gap: 7,
            borderRadius: 9999,
            border: "1px solid var(--line)",
            background: "rgb(26 31 43 / 0.6)",
            padding: "5px 12px",
            fontFamily: "var(--font-mono)",
            fontSize: 11,
            fontWeight: 600,
            letterSpacing: "0.08em",
            color: s.text,
            ...style,
          }}
        >
          <span
            style={{
              width: 6,
              height: 6,
              borderRadius: "50%",
              background: s.dot,
              animation: s.pulse ? "hx-pulse 1.4s ease-in-out infinite" : "none",
            }}
          />
          {label || s.label}
        </span>
      );
    }

    // Shell
    function Sidebar({ items, activeKey, onNavigate }) {
      return (
        <div
          style={{
            display: "flex",
            flexDirection: "column",
            height: "100%",
            width: 256,
            padding: "20px 12px",
            background: "rgb(17 20 29 / 0.7)",
            backdropFilter: "blur(12px)",
            borderRight: "1px solid var(--line)",
          }}
        >
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 8px 24px" }}>
            <span style={{ display: "grid", placeItems: "center", width: 28, height: 28, borderRadius: 8, background: "var(--accent-strong)", color: "var(--void)" }}>
              <Icon icon="solar:graph-up-linear" size={17} />
            </span>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 600, letterSpacing: "0.04em", color: "var(--ink)" }}>HEX·YT</span>
          </div>
          <nav style={{ display: "flex", flexDirection: "column", gap: 2, flex: 1 }}>
            {items.map((it) => {
              const active = it.key === activeKey;
              return (
                <button
                  key={it.key}
                  type="button"
                  onClick={() => onNavigate(it.key)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 11,
                    borderRadius: 8,
                    padding: "8px 11px",
                    fontSize: 13.5,
                    fontFamily: "var(--font-sans)",
                    border: "none",
                    cursor: "pointer",
                    textAlign: "left",
                    background: active ? "rgb(6 182 212 / 0.10)" : "transparent",
                    color: active ? "var(--ink)" : "var(--ink-secondary)",
                  }}
                >
                  <Icon icon={it.icon} size={17} style={{ color: active ? "var(--accent)" : "inherit" }} />
                  <span style={{ flex: 1 }}>{it.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    function TopBar({ search, onSearchChange, tier }) {
      return (
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 12,
            padding: "12px 24px",
            borderBottom: "1px solid var(--line)",
            background: "rgb(17 20 29 / 0.7)",
            backdropFilter: "blur(12px)",
          }}
        >
          <label
            style={{
              display: "flex",
              minWidth: 0,
              flex: 1,
              alignItems: "center",
              gap: 8,
              maxWidth: 460,
              borderRadius: 8,
              border: "1px solid var(--line)",
              background: "rgb(26 31 43 / 0.6)",
              padding: "8px 12px",
            }}
          >
            <Icon icon="solar:magnifer-linear" size={16} style={{ color: "var(--ink-muted)" }} />
            <input
              value={search}
              onChange={(e) => onSearchChange(e.target.value)}
              placeholder="Search your knowledge graph"
              style={{
                minWidth: 0,
                flex: 1,
                background: "transparent",
                border: "none",
                outline: "none",
                color: "var(--ink)",
                fontFamily: "var(--font-sans)",
                fontSize: 13.5,
              }}
            />
            <kbd style={{ fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--ink-muted)", border: "1px solid var(--line)", borderRadius: 4, padding: "1px 6px" }}>⌘K</kbd>
          </label>
          <span style={{ flex: 1 }} />
          {tier && (
            <span
              style={{
                display: "inline-flex",
                alignItems: "center",
                gap: 6,
                borderRadius: 9999,
                border: "1px solid rgb(6 182 212 / 0.3)",
                background: "rgb(6 182 212 / 0.10)",
                padding: "4px 11px",
                fontFamily: "var(--font-mono)",
                fontSize: 11,
                fontWeight: 600,
                letterSpacing: "0.08em",
                color: "var(--accent-ink)",
              }}
            >
              <Icon icon="solar:crown-minimalistic-linear" size={12} />
              {tier.toUpperCase()}
            </span>
          )}
        </div>
      );
    }

    // Screens
    function AnalysisHero({ url, status, onUrlChange, onAnalyze, error, quota }) {
      const streaming = status === "streaming";
      const disabled = streaming || !url || url.trim().length === 0;
      return (
        <section className="hx-rise">
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <MonoLabel index="//">synthesis console</MonoLabel>
            <StatusBadge status={status} />
          </div>
          <h1 className="hx-h1" style={{ maxWidth: "20ch" }}>Drop a YouTube URL. Get a structured synthesis across 11 dimensions.</h1>
          <p className="hx-body-lg" style={{ marginTop: 12, maxWidth: "54ch" }}>Transcript, claims, frameworks, and contrarian takes, mapped into your knowledge graph and searchable in seconds.</p>
          <GlowBorder active={streaming} radius="control" style={{ marginTop: 28, maxWidth: 640 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, background: "var(--surface)", padding: 8, borderRadius: 7 }}>
              <span aria-hidden="true" style={{ display: "grid", placeItems: "center", width: 36, height: 36, borderRadius: 8, background: "var(--bg)", color: "var(--accent)", flex: "none" }}>
                <Icon icon="solar:link-round-angle-linear" size={19} />
              </span>
              <input
                type="url"
                value={url}
                onChange={(e) => onUrlChange(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter" && !disabled) onAnalyze(); }}
                placeholder="https://youtube.com/watch?v=..."
                style={{
                  minWidth: 0,
                  flex: 1,
                  background: "transparent",
                  border: "none",
                  outline: "none",
                  padding: "0 4px",
                  fontFamily: "var(--font-mono)",
                  fontSize: 13.5,
                  color: "var(--ink)",
                }}
              />
              <button
                type="button"
                onClick={onAnalyze}
                disabled={disabled}
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 8,
                  borderRadius: 8,
                  border: "none",
                  background: "var(--accent-strong)",
                  color: "var(--void)",
                  padding: "10px 16px",
                  fontFamily: "var(--font-sans)",
                  fontSize: 13.5,
                  fontWeight: 500,
                  cursor: disabled && !streaming ? "not-allowed" : "pointer",
                  opacity: disabled && !streaming ? 0.4 : 1,
                }}
              >
                <Icon icon={streaming ? "solar:refresh-linear" : "solar:bolt-linear"} size={16} />
                {streaming ? "Analyzing" : "Analyze"}
              </button>
            </div>
          </GlowBorder>
          <div style={{ marginTop: 8, display: "flex", minHeight: 20, maxWidth: 640, alignItems: "center", justifyContent: "space-between", fontSize: 12 }}>
            {status === "error" && error && <span style={{ fontFamily: "var(--font-mono)", color: "var(--err)" }}>{error}</span>}
            {quota && <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink-muted)" }}>{quota}</span>}
          </div>
        </section>
      );
    }

    const DIMENSION_META = {
      thesis: { label: "CORE THESIS", icon: "solar:target-linear" },
      arguments: { label: "KEY ARGUMENTS", icon: "solar:chat-square-like-linear" },
      evidence: { label: "EVIDENCE", icon: "solar:database-linear" },
      frameworks: { label: "FRAMEWORKS", icon: "solar:widget-5-linear" },
      entities: { label: "ENTITIES", icon: "solar:users-group-rounded-linear" },
      tactics: { label: "TACTICS", icon: "solar:bolt-linear" },
      contrarian: { label: "CONTRARIAN TAKES", icon: "solar:shuffle-linear" },
      questions: { label: "OPEN QUESTIONS", icon: "solar:question-circle-linear" },
      actions: { label: "ACTION ITEMS", icon: "solar:checklist-minimalistic-linear" },
      quotes: { label: "NOTABLE QUOTES", icon: "solar:quote-up-linear" },
      connections: { label: "GRAPH LINKS", icon: "solar:graph-linear" },
    };

    const SPAN = { 1: "span 2", 2: "span 3", 3: "span 4" };
    const ROWSPAN = { 1: "span 1", 2: "span 1", 3: "span 2" };

    function DimensionCard({ dimKey, status, content, span = 1, delayClass = "" }) {
      const meta = DIMENSION_META[dimKey];
      const streaming = status === "streaming";
      const index = Object.keys(DIMENSION_META).indexOf(dimKey) + 1;
      return (
        <GlowBorder active={streaming} radius="card" className={delayClass} style={{ gridColumn: SPAN[span], gridRow: ROWSPAN[span] }}>
          <article
            style={{
              display: "flex",
              flexDirection: "column",
              height: "100%",
              background: "var(--surface)",
              padding: 20,
              borderRadius: 15,
              boxSizing: "border-box",
              boxShadow: status === "error" ? "inset 0 0 0 1px rgb(239 68 68 / 0.4)" : "none",
            }}
          >
            <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <MonoLabel index={String(index).padStart(2, "0")}>{meta.label}</MonoLabel>
              <span aria-hidden="true" style={{ display: "grid", placeItems: "center", width: 32, height: 32, borderRadius: 8, border: "1px solid var(--line)", background: "var(--bg)", color: streaming ? "var(--accent)" : "var(--ink-secondary)" }}>
                <Icon icon={meta.icon} size={16} />
              </span>
            </header>
            <div style={{ minHeight: 0, flex: 1 }}>
              {status === "done" && content ? (
                <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "var(--ink-secondary)" }}>{content}</div>
              ) : status === "error" ? (
                <p style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--err)" }}>Synthesis failed for this dimension. Retry available.</p>
              ) : (
                <div aria-hidden="true" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <div style={{ height: 8, width: "84%", borderRadius: 9999, background: "rgb(51 65 85 / 0.5)" }} />
                  <div style={{ height: 8, width: "62%", borderRadius: 9999, background: "rgb(51 65 85 / 0.35)" }} />
                  {span >= 2 && <div style={{ height: 8, width: "72%", borderRadius: 9999, background: "rgb(51 65 85 / 0.35)" }} />}
                </div>
              )}
            </div>
          </article>
        </GlowBorder>
      );
    }

    function StreamingGrid({ dimensions, progress }) {
      return (
        <section>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
            <MonoLabel index="//">semantic dimensions</MonoLabel>
            {progress && <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.08em", color: "var(--ink-muted)" }}>{progress}</span>}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gridAutoRows: "minmax(132px, auto)", gap: 14 }}>
            {dimensions.map((d, i) => (
              <DimensionCard key={d.key} dimKey={d.key} status={d.status} content={d.content} span={d.span} delayClass={`hx-rise hx-rise-${(i % 4) + 1}`} />
            ))}
          </div>
        </section>
      );
    }

    // App
    function App() {
      const [activeNav, setActiveNav] = React.useState("console");
      const [search, setSearch] = React.useState("");
      const [url, setUrl] = React.useState("https://youtube.com/watch?v=dQw4w9WgXcQ");
      const [status, setStatus] = React.useState("idle");

      const navItems = [
        { key: "console", label: "Console", icon: "solar:home-2-linear" },
        { key: "saved", label: "Saved analyses", icon: "solar:folder-with-files-linear", badge: "12" },
        { key: "search", label: "Semantic search", icon: "solar:magnifer-linear" },
      ];

      const dimensionsDemo = [
        { key: "thesis", status: status, content: "The creator argues that retention, not reach, compounds a channel's long-term value.", span: 2 },
        { key: "arguments", status: status === "streaming" ? "streaming" : status === "idle" ? "idle" : "done", content: "1. Quality over quantity. 2. Subscriber lifetime value. 3. Algorithmic consistency.", span: 1 },
        { key: "evidence", status: "done", content: "Case studies: Linus Tech Tips (10yr+ retention), MrBeast (upload frequency correlates with view retention)." },
        { key: "frameworks", status: "idle" },
        { key: "entities", status: "error" },
        { key: "tactics", status: status === "streaming" ? "streaming" : "idle", span: 2 },
        { key: "contrarian", status: "done", content: "Frequency-over-quality contradicts viral growth metrics in short-form video." },
        { key: "questions", status: "idle" },
        { key: "actions", status: "idle" },
        { key: "quotes", status: "done", content: "\"Consistency beats perfection every time.\" — YT creator economy maxim." },
        { key: "connections", status: "done", span: 3 },
      ];

      return (
        <div id="root" style={{ display: "flex", height: "100vh" }}>
          <Sidebar items={navItems} activeKey={activeNav} onNavigate={setActiveNav} />
          <div className="shell">
            <TopBar search={search} onSearchChange={setSearch} tier="pro" />
            <div className="content">
              <div className="main">
                <AnalysisHero
                  url={url}
                  status={status}
                  onUrlChange={setUrl}
                  onAnalyze={() => {
                    if (status === "idle") {
                      setStatus("streaming");
                      setTimeout(() => setStatus("done"), 3000);
                    }
                  }}
                  quota="2 of 3 syntheses left"
                />
                <StreamingGrid dimensions={dimensionsDemo} progress={status === "streaming" ? "7 / 11 complete" : undefined} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
