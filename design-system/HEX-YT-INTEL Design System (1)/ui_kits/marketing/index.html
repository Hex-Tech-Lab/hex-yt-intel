<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEX-YT-INTEL — Marketing</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-sans); }
    #root { display: flex; flex-direction: column; min-height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 32px; border-bottom: 1px solid var(--line); background: rgb(17 20 29 / 0.7); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
    main { flex: 1; }
    section { padding: 60px 32px; max-width: 1280px; margin: 0 auto; width: 100%; }
    h1 { margin: 0; }
    p { margin: 12px 0 0; }
    button { display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; border: none; padding: 11px 18px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--accent-strong); color: var(--void); }
    .btn-secondary { background: transparent; color: var(--ink-secondary); border: 1px solid var(--line-strong); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function Icon({ icon, size = 16, style = {} }) {
      return <iconify-icon icon={icon} style={{ fontSize: size, ...style }} />;
    }

    function Nav() {
      return (
        <header>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ display: "grid", placeItems: "center", width: 28, height: 28, borderRadius: 8, background: "var(--accent-strong)", color: "var(--void)" }}>
              <Icon icon="solar:graph-up-linear" size={17} />
            </span>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 600, letterSpacing: "0.04em", color: "var(--ink)" }}>HEX·YT·INTEL</span>
          </div>
          <nav style={{ display: "flex", gap: 24, alignItems: "center" }}>
            <a href="#" style={{ color: "var(--ink-secondary)", textDecoration: "none", fontSize: 14 }}>Features</a>
            <a href="#" style={{ color: "var(--ink-secondary)", textDecoration: "none", fontSize: 14 }}>Pricing</a>
            <a href="#" style={{ color: "var(--ink-secondary)", textDecoration: "none", fontSize: 14 }}>Docs</a>
            <button className="btn-primary">Sign in</button>
          </nav>
        </header>
      );
    }

    function Hero() {
      return (
        <section style={{ textAlign: "center", paddingTop: 80, paddingBottom: 80 }}>
          <div style={{ maxWidth: "52ch", margin: "0 auto" }}>
            <p style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-muted)", margin: 0 }}>// YouTube → knowledge graph</p>
            <h1 className="hx-display" style={{ marginTop: 16, marginBottom: 12 }}>
              Drop a video. Get a synthesis.
            </h1>
            <p className="hx-body-lg" style={{ maxWidth: "54ch", margin: "0 auto" }}>
              Transcript, claims, frameworks, and contrarian takes — structured across 11 dimensions, mapped into your knowledge graph, searchable in seconds.
            </p>
            <div style={{ marginTop: 32, display: "flex", justifyContent: "center", gap: 12 }}>
              <button className="btn-primary">
                <Icon icon="solar:bolt-linear" size={16} />
                Try it free
              </button>
              <button className="btn-secondary">
                See a sample
                <Icon icon="solar:arrow-right-linear" size={16} />
              </button>
            </div>
          </div>
          <div style={{ marginTop: 48, padding: 32, borderRadius: 16, border: "1px solid rgb(148 163 184 / 0.18)", background: "rgb(26 31 43 / 0.6)" }}>
            <div style={{ height: 220, background: "linear-gradient(135deg, rgb(51 65 85 / 0.3) 0%, transparent 60%)", borderRadius: 12 }} />
          </div>
        </section>
      );
    }

    function Features() {
      const features = [
        { icon: "solar:target-linear", title: "Core thesis", desc: "The central claim distilled to one clear sentence." },
        { icon: "solar:chat-square-like-linear", title: "Key arguments", desc: "Supporting points ranked by relevance and evidence strength." },
        { icon: "solar:database-linear", title: "Evidence", desc: "Citations, timestamps, and source material linked." },
        { icon: "solar:widget-5-linear", title: "Frameworks", desc: "Mental models and applicable systems thinking." },
        { icon: "solar:users-group-rounded-linear", title: "Entities", desc: "People, companies, products mentioned and mapped." },
        { icon: "solar:bolt-linear", title: "Tactics", desc: "Actionable techniques and implementation methods." },
      ];
      return (
        <section style={{ borderTop: "1px solid var(--line)" }}>
          <div style={{ maxWidth: "52ch", marginBottom: 48 }}>
            <p style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-muted)", margin: 0 }}>// 11-dimension synthesis</p>
            <h2 className="hx-h2" style={{ marginTop: 12 }}>The UCIS model.</h2>
            <p className="hx-body-lg">Every video is parsed across 11 semantic dimensions. You get the full picture — not a summary, a structured synthesis.</p>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 24 }}>
            {features.map((f) => (
              <div key={f.title} style={{ padding: 20, background: "rgb(26 31 43 / 0.6)", border: "1px solid var(--line)", borderRadius: 16 }}>
                <Icon icon={f.icon} size={24} style={{ color: "var(--accent)" }} />
                <h3 style={{ marginTop: 12, marginBottom: 0, fontSize: 18, fontWeight: 500 }}>{f.title}</h3>
                <p style={{ fontSize: 14, color: "var(--ink-secondary)", marginTop: 8 }}>{f.desc}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function Pricing() {
      const plans = [
        { name: "Free", price: "$0", desc: "Get started", features: ["3 syntheses/month", "Personal library only", "Standard support"] },
        { name: "Pro", price: "$29", desc: "/month, billed annually", features: ["Unlimited syntheses", "Team repos (up to 5)", "Priority support", "API access"] },
        { name: "Enterprise", price: "Custom", desc: "for organizations", features: ["Dedicated infrastructure", "Custom integrations", "SLA guarantee", "Team training"] },
      ];
      return (
        <section style={{ borderTop: "1px solid var(--line)" }}>
          <div style={{ maxWidth: "52ch", marginBottom: 48 }}>
            <p style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-muted)", margin: 0 }}>// Plans</p>
            <h2 className="hx-h2" style={{ marginTop: 12 }}>Simple, transparent pricing.</h2>
            <p className="hx-body-lg">Pay for what you use. Cancel anytime.</p>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 24 }}>
            {plans.map((p) => (
              <div key={p.name} style={{ padding: 32, border: p.name === "Pro" ? "1px solid var(--accent)" : "1px solid var(--line)", borderRadius: 16, background: "rgb(26 31 43 / 0.6)" }}>
                <h3 style={{ margin: 0, fontSize: 20, fontWeight: 600 }}>{p.name}</h3>
                <p style={{ margin: "4px 0 0", fontSize: 32, fontWeight: 500, color: "var(--accent)" }}>{p.price}</p>
                <p style={{ margin: "2px 0 20px", fontSize: 13, color: "var(--ink-secondary)" }}>{p.desc}</p>
                <button className={p.name === "Pro" ? "btn-primary" : "btn-secondary"} style={{ width: "100%" }}>Get started</button>
                <ul style={{ marginTop: 20, listStyle: "none", padding: 0 }}>
                  {p.features.map((f) => (
                    <li key={f} style={{ fontSize: 13, color: "var(--ink-secondary)", marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                      <Icon icon="solar:check-circle-linear" size={16} style={{ color: "var(--ok)" }} />
                      {f}
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer style={{ padding: "40px 32px", borderTop: "1px solid var(--line)", background: "rgb(26 31 43 / 0.6)", textAlign: "center" }}>
          <p style={{ fontSize: 12, color: "var(--ink-muted)" }}>© 2026 HEX-YT-INTEL. All rights reserved.</p>
        </footer>
      );
    }

    function App() {
      return (
        <>
          <Nav />
          <main>
            <Hero />
            <Features />
            <Pricing />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
