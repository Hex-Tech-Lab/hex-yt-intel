packages:
  - "."
  - "web"
  - "skill"
  - "worker"

# Collapse the React type definitions to a SINGLE version. A transitive dep with a
# loose peer ('@types/react': '>=18.0.0') was floating 19.2.15 alongside the pinned
# version, producing two incompatible ReactNode defs → "Link/ForceGraph2D cannot be
# used as a JSX component". A single unified version (here aligned to the React 19.2.6
# runtime per CodeRabbit, so 19.2 type APIs like useEffectEvent/<Activity> are covered)
# eliminates the dup. (pnpm 11 reads overrides here, not in package.json.)
#
# Security overrides:
# - "postcss": Pinned to "^8.4.49" to resolve a transitive XSS vulnerability. This override forces
#   the secure version across all workspaces (e.g., Next.js in web/package.json which relies on postcss).
# - "esbuild": Pinned to "^0.28.0" to resolve a dev server vulnerability. This is safe as it's only 
#   used in the worker/package.json build script for basic ESM bundling without dev server/watch mode features.
overrides:
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"
  "postcss": "^8.5.16"
  "esbuild": "^0.28.1"
  # Dependabot alerts #69,71,72 (2026-07-24): each pin below is the first
  # version GitHub's advisory data confirms as patched, not a blind
  # latest-bump. (tar's #62-65 and js-yaml's #61 bumps are on their
  # pre-existing entries further down, not duplicated here.)
  # Dependabot alerts #96,97,99-107 (2026-08-04): fast-uri/hono/undici's
  # existing pins above had drifted stale (still resolving inside newer
  # vulnerable ranges); ip-address had no pin at all. All 4 bumped to the
  # first version each advisory confirms as patched.
  "fast-uri": "^3.1.5"
  "sharp": "^0.35.0"
  "hono": "^4.12.34"
  "ip-address": "^10.3.1"
  "eslint-plugin-react-hooks": "5.1.0"
  "eslint-plugin-react": "7.34.3"
  # eslint-config-next + @next/eslint-plugin-next are deliberately PINNED at
  # 14.2.16 and do NOT track web/package.json's next version (next itself is
  # 16.3.3). Rationale (PR #317 round-2 audit, 2026-09-18): every
  # eslint-config-next >=15 declares peer "eslint": ">=9.0.0", but this repo
  # is frozen on ESLint 8.57.1 with legacy .eslintrc.json — bumping requires
  # an ESLint 9 + flat-config migration (out of blast radius for CVE-bump
  # PRs). web/package.json's eslint-config-next specifier is kept identical
  # to this pin so the declared and resolved versions can't drift apart
  # silently again (they had: package.json said 16.2.6 while the override
  # resolved 14.2.16). A compatibility guard test asserts both stay in
  # sync: web/lib/__tests__/next-dependency-guards.test.ts
  "eslint-config-next": "14.2.16"
  "@next/eslint-plugin-next": "14.2.16"
  "glob@>=10.2.0 <10.5.0": "10.5.0"
  "undici": "^7.29.0"
  "ajv": "^8.18.0"
  "@eslint/eslintrc>ajv": "^6.14.0"
  "eslint>ajv": "^6.14.0"
  "dompurify": "^3.4.13"
  # Dependabot alerts #110-112 (2026-08-08): nanoid's 3.x line (transitive,
  # via postcss) and 5.x line (direct dependency, see web/package.json)
  # both had a "custom/non-secure generator can loop indefinitely on
  # negative/zero size" CVE, each with its own first-patched version.
  "nanoid": "^6.0.1"
  "path-to-regexp@>=4.0.0 <6.3.0": "6.3.0"
  "path-to-regexp@>=8.0.0 <8.4.0": "8.4.2"
  # Dependabot #62-65 (2026-07-24): 4 cascading CVEs (moderate->critical),
  # 7.5.19 is the first version patching all of them at once.
  "tar": "^7.5.19"
  "minimatch": "^10.2.5"
  "brace-expansion": "^5.0.7"
  "smol-toml": "^1.6.1"
  "srvx": "^0.11.16"
  "@tootallnate/once": "^3.0.1"
  "ws": "^8.21.0"
  "form-data": "^4.0.6"
  # Dependabot #61 (2026-07-24): bumped ^4.1.2 -> ^4.3.0 (YAML merge-key
  # quadratic-CPU CVE).
  # Dependabot #108 (2026-08-07): bumped ^4.3.0 -> ^4.3.1 (GHSA-5p4m-2wfm-xmqj /
  # CVE-2026-59870, quadratic CPU in !!omap resolution -- the 5.x fix for the
  # same weakness was never backported to 3.x/4.x until 4.3.1).
  "js-yaml": "^4.3.1"
  "@opentelemetry/core": "^2.8.0"

allowBuilds:
  '@astryxdesign/core': true
  "@sentry/cli": true
  "esbuild": true
  "sharp": true
  "unrs-resolver": true
  "workerd": true
