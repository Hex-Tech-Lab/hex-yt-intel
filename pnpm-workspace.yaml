packages:
  - "."
  - "web"
  - "skill"
  - "worker"

# Collapse the React type definitions to a single version. A transitive dep with a
# loose peer ('@types/react': '>=18.0.0') was floating 19.2.15 alongside the pinned
# 19.0.0, producing two incompatible ReactNode defs → "Link/ForceGraph2D cannot be
# used as a JSX component". (pnpm 11 reads overrides here, not in package.json.)
overrides:
  "@types/react": "19.0.0"
  "@types/react-dom": "19.0.0"

allowBuilds:
  "@sentry/cli": true
  "esbuild": true
  "sharp": true
  "unrs-resolver": true
  "workerd": true
