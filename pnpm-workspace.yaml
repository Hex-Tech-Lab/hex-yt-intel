packages:
  - "."
  - "web"
  - "skill"
  - "worker"

# Collapse the React type definitions to a SINGLE version. A transitive dep with a
# loose peer ('@types/react': '>=18.0.0') was floating 19.2.15 alongside the pinned
# version, producing two incompatible ReactNode defs → "Link/ForceGraph2D cannot be
# used as a JSX component". A single unified version (here aligned to the React 19.2.6
# runtime per CodeRabbit, so 19.2 type APIs like useEffectEvent/<Activity> are covered)
# eliminates the dup. (pnpm 11 reads overrides here, not in package.json.)
#
# Security overrides:
# - "postcss": Pinned to "^8.4.49" to resolve a transitive XSS vulnerability. This override forces
#   the secure version across all workspaces (e.g., Next.js in web/package.json which relies on postcss).
# - "esbuild": Pinned to "^0.28.0" to resolve a dev server vulnerability. This is safe as it's only 
#   used in the worker/package.json build script for basic ESM bundling without dev server/watch mode features.
overrides:
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"
  "postcss": "^8.4.49"
  "esbuild": "^0.28.1"
  "eslint-plugin-react-hooks": "5.1.0"
  "eslint-plugin-react": "7.34.3"
  "eslint-config-next": "14.2.16"
  "@next/eslint-plugin-next": "14.2.16"
  "glob@>=10.2.0 <10.5.0": "10.5.0"
  "undici": "^7.25.0"
  "ajv": "^8.18.0"
  "@eslint/eslintrc>ajv": "6.12.6"
  "eslint>ajv": "6.12.6"
  "dompurify": "^3.4.11"
  "path-to-regexp@>=4.0.0 <6.3.0": "6.3.0"
  "path-to-regexp@>=8.0.0 <8.4.0": "8.4.2"
  "tar": "^7.5.16"
  "minimatch": "^10.2.5"
  "smol-toml": "^1.6.1"
  "srvx": "^0.11.16"
  "@tootallnate/once": "^3.0.1"
  "ws": "^8.21.0"
  "form-data": "^4.0.6"
  "js-yaml": "^4.1.2"
  "@opentelemetry/core": "^2.8.0"

allowBuilds:
  "@sentry/cli": true
  "esbuild": true
  "sharp": true
  "unrs-resolver": true
  "workerd": true
